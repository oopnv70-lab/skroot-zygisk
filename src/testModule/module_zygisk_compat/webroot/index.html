<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>SKZygiskCompat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    function getStatus() {
      fetch('/getStatus', { method: 'POST', body: '' })
        .then(r => r.json())
        .then(d => { document.getElementById('status').textContent =
          "入口已调用 | PID=" + d.pid + " | UID=" + d.uid; })
        .catch(e => { document.getElementById('status').textContent = "请求失败：" + e; });
    }

    async function uploadModule() {
      const input = document.getElementById('file');
      if (!input.files.length) { alert('请先选择一个模块 ZIP'); return; }
      const file = input.files[0];
      const fd = new FormData();
      fd.append('module', file, file.name);

      const box = document.getElementById('result');
      box.textContent = "上传中：" + file.name + " ...";
      try {
        const resp = await fetch('/upload', { method: 'POST', body: fd });
        const data = await resp.json();
        box.textContent = "已上传 → " + data.name + "\n落盘路径：" + data.path;
      } catch (e) {
        box.textContent = "上传失败：" + e;
      }
    }

    async function installModule() {
      const box = document.getElementById('result');
      box.textContent = "安装中，请稍候...";
      try {
        const resp = await fetch('/install', { method: 'POST', body: '' });
        const data = await resp.json();
        if (data.ok) {
          box.textContent = "安装完成：\n\n" + data.report;
        } else {
          box.textContent = "安装失败：\n" + data.report;
        }
      } catch (e) {
        box.textContent = "安装请求失败：" + e;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      getStatus();
      document.getElementById('uploadBtn').addEventListener('click', uploadModule);
      document.getElementById('installBtn').addEventListener('click', installModule);
    });
  </script>
</head>
<body>
  <h1>SKZygiskCompat</h1>
  <p>Magisk 兼容层：上传一个 Magisk 模块 zip → 装进容器 → 运行其脚本</p>

  <div id="status" style="font-size:1.1em; margin-bottom:1em;">加载中...</div>

  <h2>1. 选择模块</h2>
  <input type="file" id="file" accept=".zip" />
  <button id="uploadBtn">上传</button>

  <h2>2. 安装并运行</h2>
  <button id="installBtn">安装到 /data/adb/modules 并运行</button>

  <h3>结果</h3>
  <pre id="result" style="white-space:pre-wrap; word-break:break-all; background:#111; color:#0f0; padding:1em; min-height:300px;">（待操作）</pre>
</body>
</html>
