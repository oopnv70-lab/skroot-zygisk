name: build-mincompat

on:
  push:
    paths:
      - 'src/testModule/module_mincompat/**'
      - 'src/testModule/kernel_module_kit/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK r26d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> "$GITHUB_ENV"

      - name: Restore static library from chunks
        run: |
          cd src/testModule/kernel_module_kit/lib
          cat libkernel_module_kit_static.a.xz.part_aa libkernel_module_kit_static.a.xz.part_ab > libkernel_module_kit_static.a.xz
          xz -d libkernel_module_kit_static.a.xz
          md5sum libkernel_module_kit_static.a
          ls -la libkernel_module_kit_static.a

      - name: ndk-build mincompat (arm64-v8a only)
        run: |
          cd src/testModule/module_mincompat
          "$ANDROID_NDK_HOME/ndk-build" -j"$(nproc)" APP_ABI=arm64-v8a
          ls -la libs/arm64-v8a/

      - name: Package mincompat module ZIP
        run: |
          cd src/testModule/module_mincompat
          cp libs/arm64-v8a/libmincompat.so ./libmincompat.so
          zip -r mincompat.zip libmincompat.so
          unzip -l mincompat.zip

      - name: Upload mincompat artifact
        uses: actions/upload-artifact@v4
        with:
          name: mincompat
          path: src/testModule/module_mincompat/mincompat.zip
          if-no-files-found: error
