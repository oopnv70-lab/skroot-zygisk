name: build-skygisk-compat-module

on:
  push:
    paths:
      - 'src/testModule/module_zygisk_compat/**'
      - 'src/testModule/kernel_module_kit/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK r26d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> "$GITHUB_ENV"

      - name: Restore static library from chunks
        run: |
          cd src/testModule/kernel_module_kit/lib
          cat libkernel_module_kit_static.a.xz.part_aa libkernel_module_kit_static.a.xz.part_ab > libkernel_module_kit_static.a.xz
          xz -d libkernel_module_kit_static.a.xz
          md5sum libkernel_module_kit_static.a
          ls -la libkernel_module_kit_static.a

      - name: ndk-build
        run: |
          cd src/testModule/module_zygisk_compat
          "$ANDROID_NDK_HOME/ndk-build" -j"$(nproc)"
          ls -la libs/arm64-v8a/

      - name: Package module ZIP
        run: |
          cd src/testModule/module_zygisk_compat
          cp libs/arm64-v8a/libskzygisk_compat.so ./libskzygisk_compat.so
          zip -r skzygiskcompat-v0.2.0.zip libskzygisk_compat.so webroot
          unzip -l skzygiskcompat-v0.2.0.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skzygiskcompat-v0.2.0
          path: src/testModule/module_zygisk_compat/skzygiskcompat-v0.2.0.zip
          if-no-files-found: error
